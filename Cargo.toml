[package]
name = "byte-stream-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
description = "Byte-range reads of hyperblobs blobs with a sliding download window, and a leak-free HTTP Range server"
keywords = ["hypercore", "hyperblobs", "http", "range", "p2p"]
categories = ["network-programming"]

[lib]
name = "byte_stream"

[dependencies]
bytes = "1"
compact-encoding-rs = { path = "../compact-encoding-rs" }
futures-util = { version = "0.3", default-features = false }
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
hyperblobs-rs = { path = "../hyperblobs-rs" }
hypercore-id-encoding-rs = { path = "../hypercore-id-encoding-rs" }
hypercore-rs = { path = "../hypercore-rs" }
rand = "0.8"
tokio = { version = "1.40", features = ["net", "rt", "sync", "macros"] }

[dev-dependencies]
peeroxide = "1.7.4"
peeroxide-dht = "1.7.4"
protomux-rs = { path = "../protomux-rs" }
tempfile = "3"
tokio = { version = "1.40", features = ["full"] }
serde_json = "1"

# Our fork: UDX write pipelining, C-compatible pacing and SACKs, reachability check (see ../peeroxide).
[patch.crates-io]
peeroxide = { path = "../peeroxide/peeroxide" }
peeroxide-dht = { path = "../peeroxide/peeroxide-dht" }
libudx = { path = "../peeroxide/libudx" }
